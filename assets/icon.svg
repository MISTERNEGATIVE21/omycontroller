<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d446b"/>
      <stop offset="100%" stop-color="#1f2338"/>
    </linearGradient>
    <linearGradient id="gripGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e47"/>
      <stop offset="100%" stop-color="#181a29"/>
    </linearGradient>
    <linearGradient id="gripGradR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e47"/>
      <stop offset="100%" stop-color="#181a29"/>
    </linearGradient>
  </defs>

  <!-- grip contours -->
  <path d="M7 32 l7 19 a5 5 0 0 0 5 3.5 h4 a4 4 0 0 0 3.2-1.6 L31 42 Z" fill="url(#gripGradL)" stroke="#4e588a" stroke-width="1.2"/>
  <path d="M57 32 l-7 19 a5 5 0 0 1 -5 3.5 h-4 a4 4 0 0 1 -3.2-1.6 L33 42 Z" fill="url(#gripGradR)" stroke="#4e588a" stroke-width="1.2"/>

  <!-- main chassis body -->
  <rect x="5" y="16" width="54" height="28" rx="12" fill="url(#bodyGrad)" stroke="#636fa4" stroke-width="1.5"/>
  <!-- top bevel highlight -->
  <rect x="9" y="17.5" width="46" height="7" rx="3.5" fill="#ffffff" opacity="0.08"/>

  <!-- dpad -->
  <rect x="13.5" y="26" width="5" height="10" rx="1.8" fill="#7082ff"/>
  <rect x="11" y="28.5" width="10" height="5" rx="1.8" fill="#7082ff"/>
  <circle cx="16" cy="31" r="1.2" fill="#1f2338"/>

  <!-- left thumbstick (asymmetric Xbox style) -->
  <circle cx="27" cy="27" r="4.8" fill="#434c77" stroke="#7e8bff" stroke-width="1.2"/>
  <circle cx="27" cy="27" r="2.2" fill="#1b1d2e"/>

  <!-- right thumbstick -->
  <circle cx="37" cy="35" r="4.8" fill="#434c77" stroke="#7e8bff" stroke-width="1.2"/>
  <circle cx="37" cy="35" r="2.2" fill="#1b1d2e"/>

  <!-- center logo / guide -->
  <circle cx="32" cy="22" r="2.5" fill="#00e5ff" opacity="0.9"/>

  <!-- face buttons (A=green, B=red, X=blue, Y=yellow) -->
  <circle cx="48" cy="22.5" r="2" fill="#ffd166"/> <!-- Y -->
  <circle cx="48" cy="31.5" r="2" fill="#06d6a0"/> <!-- A -->
  <circle cx="43.5" cy="27" r="2" fill="#118ab2"/> <!-- X -->
  <circle cx="52.5" cy="27" r="2" fill="#ef476f"/> <!-- B -->
</svg>