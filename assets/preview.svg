<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#161926"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2235"/>
      <stop offset="100%" stop-color="#151724"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Left: Popout Panel Mockup -->
  <g transform="translate(40, 30)">
    <!-- Panel frame -->
    <rect width="420" height="440" rx="12" fill="url(#panelGrad)" stroke="#31364d" stroke-width="1.5" filter="drop-shadow(0 12px 28px rgba(0,0,0,0.5))"/>

    <!-- Panel Header -->
    <text x="24" y="36" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="2">OMYCONTROLLER</text>
    <rect x="180" y="22" width="62" height="18" rx="9" fill="rgba(255,255,255,0.08)"/>
    <text x="211" y="35" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">1 pad · sim</text>

    <!-- Demo badge button -->
    <rect x="316" y="19" width="80" height="24" rx="6" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="1"/>
    <text x="356" y="35" fill="#a5b4fc" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">⚡ Demo (Active)</text>

    <!-- Separator -->
    <line x1="20" y1="54" x2="400" y2="54" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Slot selector pills -->
    <g transform="translate(20, 64)">
      <!-- P1 (Selected) -->
      <rect x="0" y="0" width="90" height="34" rx="6" fill="rgba(99,102,241,0.18)" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="12" cy="17" r="3.5" fill="#6366f1"/>
      <text x="22" y="15" fill="#6366f1" font-family="sans-serif" font-size="10" font-weight="700">P1</text>
      <text x="22" y="27" fill="#94a3b8" font-family="sans-serif" font-size="8">100% ⚡</text>

      <!-- P2 -->
      <rect x="96" y="0" width="90" height="34" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="108" cy="17" r="3.5" fill="#f43f5e"/>
      <text x="118" y="15" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700">P2</text>
      <text x="118" y="27" fill="#64748b" font-family="sans-serif" font-size="8">empty</text>

      <!-- P3 -->
      <rect x="192" y="0" width="90" height="34" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="204" cy="17" r="3.5" fill="#10b981"/>
      <text x="214" y="15" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700">P3</text>
      <text x="214" y="27" fill="#64748b" font-family="sans-serif" font-size="8">empty</text>

      <!-- P4 -->
      <rect x="288" y="0" width="90" height="34" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="300" cy="17" r="3.5" fill="#f59e0b"/>
      <text x="310" y="15" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700">P4</text>
      <text x="310" y="27" fill="#64748b" font-family="sans-serif" font-size="8">empty</text>
    </g>

    <!-- Tab Bar -->
    <g transform="translate(20, 108)">
      <rect width="380" height="28" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <!-- Tab 1 Active -->
      <rect x="2" y="2" width="72" height="24" rx="4" fill="rgba(99,102,241,0.25)" stroke="#6366f1" stroke-width="1"/>
      <text x="38" y="17" fill="#a5b4fc" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Overview</text>

      <text x="114" y="17" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Sticks &amp; Trig</text>
      <text x="190" y="17" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Haptics</text>
      <text x="266" y="17" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Motion</text>
      <text x="342" y="17" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Specs</text>
    </g>

    <!-- Mini Controller Art preview inside panel -->
    <g transform="translate(70, 146)">
      <!-- Controller Silhouette -->
      <rect x="30" y="20" width="220" height="90" rx="36" fill="#222638" stroke="#3d4461" stroke-width="1.5"/>
      <path d="M42 60 L24 125 A12 12 0 0 0 35 140 L58 135 L68 85 Z" fill="#222638" stroke="#3d4461" stroke-width="1.5"/>
      <path d="M238 60 L256 125 A12 12 0 0 1 245 140 L222 135 L212 85 Z" fill="#222638" stroke="#3d4461" stroke-width="1.5"/>

      <!-- Bumpers -->
      <rect x="50" y="12" width="50" height="12" rx="6" fill="#2d334a" stroke="#4b5563"/>
      <text x="75" y="21" fill="#94a3b8" font-family="sans-serif" font-size="7" font-weight="700" text-anchor="middle">LB</text>
      <rect x="180" y="12" width="50" height="12" rx="6" fill="#2d334a" stroke="#4b5563"/>
      <text x="205" y="21" fill="#94a3b8" font-family="sans-serif" font-size="7" font-weight="700" text-anchor="middle">RB</text>

      <!-- Sticks with glow -->
      <circle cx="85" cy="55" r="16" fill="#181a26" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="85" cy="55" r="8" fill="#6366f1"/>

      <circle cx="165" cy="75" r="16" fill="#181a26" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="165" cy="75" r="8" fill="#6366f1"/>

      <!-- Dpad -->
      <path d="M115 65 h8 v-8 h8 v8 h8 v8 h-8 v8 h-8 v-8 h-8 z" fill="#2d334a" stroke="#4b5563"/>

      <!-- Face buttons (Kenney colorful caps) -->
      <circle cx="195" cy="40" r="7" fill="rgba(241,196,15,0.25)" stroke="#f1c40f" stroke-width="1.5"/>
      <text x="195" y="43" fill="#f1c40f" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">Y</text>

      <circle cx="195" cy="68" r="7" fill="rgba(46,204,113,0.25)" stroke="#2ecc71" stroke-width="1.5"/>
      <text x="195" y="71" fill="#2ecc71" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">A</text>

      <circle cx="181" cy="54" r="7" fill="rgba(52,152,219,0.25)" stroke="#3498db" stroke-width="1.5"/>
      <text x="181" y="57" fill="#3498db" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">X</text>

      <circle cx="209" cy="54" r="7" fill="rgba(231,76,60,0.25)" stroke="#e74c3c" stroke-width="1.5"/>
      <text x="209" y="57" fill="#e74c3c" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">B</text>
    </g>

    <!-- Status Cards (2 columns) -->
    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="186" height="48" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="10" y="16" fill="#94a3b8" font-family="sans-serif" font-size="8">Connection</text>
      <text x="10" y="32" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Wired USB (Virtual)</text>
      <text x="10" y="43" fill="#64748b" font-family="sans-serif" font-size="7">/dev/input/js0 · 500 Hz</text>

      <rect x="194" y="0" width="186" height="48" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="204" y="16" fill="#94a3b8" font-family="sans-serif" font-size="8">Battery &amp; Power</text>
      <text x="204" y="32" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">100% ⚡ Charging</text>
      <text x="204" y="43" fill="#64748b" font-family="sans-serif" font-size="7">Constant external USB power</text>
    </g>

    <!-- Footer -->
    <g transform="translate(20, 410)">
      <line x1="0" y1="0" x2="380" y2="0" stroke="rgba(255,255,255,0.08)"/>
      <text x="0" y="16" fill="#64748b" font-family="sans-serif" font-size="9">Scan 2.0s · Polling rate: 500 Hz · Latency: 2.0 ms (±0.12 ms jitter)</text>
    </g>
  </g>

  <!-- Right: Feature Callouts & Circularity Radar -->
  <g transform="translate(490, 40)">
    <!-- Main Title -->
    <text x="0" y="32" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">omycontroller</text>
    <text x="0" y="54" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">PRO CONTROL DECK FOR OMARCHY</text>

    <!-- Circularity Radar Card -->
    <g transform="translate(0, 72)">
      <rect width="270" height="240" rx="10" fill="#1b1f30" stroke="#2d334d" stroke-width="1.5"/>
      <text x="14" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Precision Circularity Radar</text>
      <text x="14" y="38" fill="#94a3b8" font-family="sans-serif" font-size="8">Real-time Cartesian deadzone sweep</text>

      <!-- Radar Display -->
      <g transform="translate(135, 130)">
        <!-- Grid circles -->
        <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <circle cx="0" cy="0" r="50" fill="none" stroke="rgba(99,102,241,0.3)" stroke-width="1.5" stroke-dasharray="3,3"/>
        <circle cx="0" cy="0" r="14" fill="none" stroke="rgba(239,68,68,0.4)" stroke-width="1"/>

        <!-- Crosshairs -->
        <line x1="-70" y1="0" x2="70" y2="0" stroke="rgba(255,255,255,0.12)"/>
        <line x1="0" y1="-70" x2="0" y2="70" stroke="rgba(255,255,255,0.12)"/>

        <!-- Circular motion trail -->
        <path d="M 48 0 A 48 48 0 1 1 -48 0 A 48 48 0 1 1 48 0" fill="rgba(99,102,241,0.08)" stroke="#6366f1" stroke-width="2"/>

        <!-- Active point -->
        <circle cx="34" cy="-34" r="5" fill="#38bdf8" filter="url(#glow)"/>
        <line x1="0" y1="0" x2="34" y2="-34" stroke="#38bdf8" stroke-width="1.5"/>
      </g>

      <!-- Metric chips below radar -->
      <rect x="14" y="206" width="116" height="22" rx="4" fill="rgba(16,185,129,0.15)"/>
      <text x="72" y="221" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Error: 4.8% (Avg)</text>

      <rect x="140" y="206" width="116" height="22" rx="4" fill="rgba(99,102,241,0.15)"/>
      <text x="198" y="221" fill="#818cf8" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Drift: 0.1%</text>
    </g>

    <!-- Feature list bullets -->
    <g transform="translate(0, 328)">
      <circle cx="6" cy="6" r="4" fill="#6366f1"/>
      <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600">Precision Benchmark &amp; Hardware Spec Sheet</text>

      <circle cx="6" cy="28" r="4" fill="#6366f1"/>
      <text x="18" y="32" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600">ControllerImage Vector Button Maps &amp; Remapper</text>

      <circle cx="6" cy="50" r="4" fill="#6366f1"/>
      <text x="18" y="54" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600">6-DOF Artificial Horizon Gyro Calibration</text>

      <circle cx="6" cy="72" r="4" fill="#6366f1"/>
      <text x="18" y="76" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600">DualSense Adaptive Triggers &amp; Rumble Mixer</text>

      <circle cx="6" cy="94" r="4" fill="#6366f1"/>
      <text x="18" y="98" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600">Interactive Virtual P1 Simulator Bench</text>
    </g>
  </g>
</svg>
